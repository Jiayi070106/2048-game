<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game2048</title>
    <link rel="stylesheet" href="./style/index.css">
</head>
<body>
   <div class="container">
    <nav>
        <h1>2048</h1>
        <div class="score">
            <div class="now">
                <span class="label">SCORE</span>
                <span class="value">0</span>
            </div>
           <div class="best">
            <span class="label">BEST</span>
            <span class="value">0</span>
           </div>
        </div>
    </nav>
    <div class="desc">
     <p>
        <strong>Play 2048 Game online</strong>Join the numbers and get to the
        <strong>2048 tile!</strong>
     </p>   
     <button class="new-game">New Game</button>
    </div>
    <main>
        <!--绘制棋盘-->
        <div class="row">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="row">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="row">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="row">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <!--绘制格子，分内外两层添加不同transform-->
    <div class="cell-container">
        <div class="cell cell-2 cell-position-1-1">
        <div class="cell-inner">2</div>
    </div>
    <div class="cell cell-4 cell-position-1-2">
        <div class="cell-inner">4</div>
    </div>
    <div class="cell cell-8 cell-position-1-3">
        <div class="cell-inner">8</div>
    </div>
    <div class="cell cell-16 cell-position-1-4">
        <div class="cell-inner">16</div>
    </div>
    <div class="cell cell-32 cell-position-2-1">
        <div class="cell-inner">32</div>
    </div>
    <div class="cell cell-64 cell-position-2-2">
        <div class="cell-inner">64</div>
    </div>
    <div class="cell cell-128 cell-position-2-3">
        <div class="cell-inner">128</div>
    </div>
    <div class="cell cell-256 cell-position-2-4">
        <div class="cell-inner">256</div>
    </div>
    <div class="cell cell-512 cell-position-3-1">
        <div class="cell-inner">512</div>
    </div>
    <div class="cell cell-1024 cell-position-3-2">
        <div class="cell-inner">1024</div>
    </div>
    <div class="cell cell-2048 cell-position-3-3">
        <div class="cell-inner">2048</div>
    </div>
    </div>
    
    </main>
    <div class="lose-overlayer">
        <div class="content">Game Over!</div>
        <button>Try again</button>
   </div>
   <div class="win-overlayer">
    <div class="content">SUCCESS!</div>
    <button>Play again</button>
   </div>
   </div>
 <script type="module" src="script/index.js"></script>
</body>
</html>
